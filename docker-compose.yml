name: typewright

services:
  app:
    build: .
    container_name: typewright
    ports:
      # Host 5000 -> container 5000. Change the left number if 5000 is taken.
      - '5000:5000'
    volumes:
      # Your library, progress, and extracted figures. Back this folder up.
      - ./data:/data
      # Drop books here to import them without a file picker. Read-only.
      - ./books:/books:ro
    environment:
      TYPEWRIGHT_DATA: /data
      TYPEWRIGHT_LIBRARY: /books
    restart: unless-stopped
