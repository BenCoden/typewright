name: typewright

services:
  app:
    build: .
    container_name: typewright
    ports:
      # Host 5000 -> container 5000. Change the left number if 5000 is taken.
      - '5000:5000'
    volumes:
      # Your library, progress, and extracted figures. Back this folder up.
      - ./data:/data
      # Drop books here to import them without a file picker. Read-only.
      - ./books:/books:ro
    environment:
      TYPEWRIGHT_DATA: /data
      TYPEWRIGHT_LIBRARY: /books
      # Only reachable when the renderer profile is running.
      TYPEWRIGHT_RENDERER: http://renderer:5001
    restart: unless-stopped

  # Optional: headless Chromium, for pages that only exist after JavaScript runs.
  #   docker compose --profile render up -d
  renderer:
    build: ./renderer
    container_name: typewright-renderer
    profiles: ['render']
    expose:
      - '5001'
    restart: unless-stopped
